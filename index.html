<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2457a6">
<title>Assistant RH — Mairie de Conflans-Sainte-Honorine</title>

<style>
:root{
  --primary:#2457a6;
  --primary-dark:#173d78;
  --primary-soft:#eef4ff;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#667085;
  --border:#dfe5ee;
  --success:#16794c;
  --success-soft:#ecfdf3;
  --warning:#b54708;
  --warning-soft:#fff7ed;
  --shadow:0 12px 35px rgba(23,32,51,.12);
  --shadow-soft:0 5px 18px rgba(23,32,51,.06);
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}

button,
input{
  font:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:920px;
  min-height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:20;
  color:#fff;
  padding:20px 24px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  box-shadow:0 4px 18px rgba(23,61,120,.18);
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:46px;
  height:46px;
  border-radius:14px;
  background:rgba(255,255,255,.16);
  display:grid;
  place-items:center;
  font-size:24px;
  flex:none;
}

h1{
  margin:0 0 3px;
  font-size:22px;
}

.subtitle{
  font-size:13px;
  opacity:.88;
}

.challenge-header-button{
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12);
  color:#fff;
  border-radius:12px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:700;
  white-space:nowrap;
}

.challenge-header-button:hover{
  background:rgba(255,255,255,.2);
}

/* =========================================================
   CONTENT
   ========================================================= */

.content{
  flex:1;
  padding:22px 18px 120px;
}

.welcome{
  margin-bottom:18px;
  padding:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.welcome h2{
  margin:0 0 8px;
  font-size:19px;
}

.welcome p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

.welcome-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:16px;
}

.suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.chip{
  border:1px solid var(--border);
  background:#fff;
  border-radius:999px;
  padding:9px 13px;
  cursor:pointer;
  color:var(--text);
  transition:.15s ease;
}

.chip:hover{
  border-color:var(--primary);
  color:var(--primary);
  transform:translateY(-1px);
}

.chat{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.msg{
  max-width:88%;
  padding:13px 15px;
  border-radius:16px;
  line-height:1.5;
  font-size:14px;
}

.bot{
  align-self:flex-start;
  background:#fff;
  border:1px solid var(--border);
  border-bottom-left-radius:5px;
}

.user{
  align-self:flex-end;
  background:var(--primary);
  color:#fff;
  border-bottom-right-radius:5px;
}

/* =========================================================
   ANSWERS
   ========================================================= */

.answer{
  padding:16px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow-soft);
}

.answer h3{
  margin:0 0 7px;
  font-size:16px;
}

.answer p{
  margin:7px 0;
  color:#344054;
  line-height:1.5;
}

.badge{
  display:inline-block;
  margin-bottom:8px;
  padding:5px 9px;
  border-radius:999px;
  background:var(--primary-soft);
  color:var(--primary-dark);
  font-size:12px;
  font-weight:700;
}

/* =========================================================
   CONTACT
   ========================================================= */

.contact{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#f7f9fc;
  border:1px solid var(--border);
}

.contact strong{
  display:block;
  margin-bottom:5px;
}

.contact a{
  color:var(--primary);
  font-weight:700;
  text-decoration:none;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.action{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-height:38px;
  padding:8px 11px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  cursor:pointer;
}

.action:hover{
  border-color:var(--primary);
}

.action.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.action.success{
  background:var(--success);
  color:#fff;
  border-color:var(--success);
}

/* =========================================================
   DOCUMENTS / LIENS
   ========================================================= */

.document-box{
  margin-top:14px;
  padding:13px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#f8fafc;
}

.document-title{
  font-weight:700;
  margin-bottom:4px;
}

.document-description{
  margin-bottom:10px;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.document-format{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border-radius:999px;
  background:var(--primary-soft);
  color:var(--primary-dark);
  font-size:11px;
  font-weight:700;
}

.document-icon{
  font-size:18px;
}

/* =========================================================
   CHALLENGE
   ========================================================= */

.challenge-card{
  overflow:hidden;
  margin-bottom:18px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.challenge-top{
  padding:20px;
  color:#fff;
  background:linear-gradient(135deg,#2457a6,#173d78);
}

.challenge-top h2{
  margin:0 0 7px;
  font-size:20px;
}

.challenge-top p{
  margin:0;
  opacity:.9;
  line-height:1.5;
}

.challenge-body{
  padding:20px;
}

.challenge-progress{
  height:8px;
  overflow:hidden;
  margin:0 0 18px;
  border-radius:999px;
  background:#edf1f7;
}

.challenge-progress-bar{
  width:0;
  height:100%;
  border-radius:999px;
  background:var(--primary);
  transition:width .3s ease;
}

.challenge-step{
  margin-bottom:18px;
}

.challenge-step-number{
  margin-bottom:7px;
  color:var(--primary);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.challenge-question{
  margin:0 0 12px;
  font-size:18px;
  line-height:1.4;
}

.challenge-hint{
  margin-top:12px;
  padding:11px 12px;
  border:1px solid #fed7aa;
  border-radius:12px;
  background:var(--warning-soft);
  color:#7c2d12;
  font-size:13px;
}

.challenge-options{
  display:grid;
  gap:9px;
}

.challenge-option{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  color:var(--text);
  text-align:left;
  cursor:pointer;
  transition:.15s ease;
}

.challenge-option:hover{
  border-color:var(--primary);
  background:var(--primary-soft);
}

.challenge-option.correct{
  border-color:var(--success);
  background:var(--success-soft);
  color:#065f46;
}

.challenge-option.wrong{
  border-color:#fda29b;
  background:#fef3f2;
  color:#b42318;
}

.challenge-feedback{
  min-height:24px;
  margin-top:12px;
  font-weight:700;
}

.challenge-secret{
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  background:#f7f9fc;
  border:1px solid var(--border);
}

.secret-letters{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.secret-letter{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:#edf1f7;
  color:#98a2b3;
  font-weight:800;
}

.secret-letter.found{
  background:var(--primary);
  color:#fff;
}

.challenge-final{
  padding:24px;
  border:1px solid #a7f3d0;
  border-radius:16px;
  background:linear-gradient(135deg,#ecfdf3,#f0fdf4);
  text-align:center;
}

.challenge-final .trophy{
  font-size:48px;
}

.challenge-final h2{
  margin:8px 0;
  color:#065f46;
}

.challenge-final p{
  color:#344054;
  line-height:1.5;
}

.challenge-secret-input{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.challenge-secret-input input{
  min-width:0;
  flex:1;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  outline:none;
}

.challenge-secret-input input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(36,87,166,.1);
}

/* =========================================================
   MOBILE DOCUMENT MODAL
   ========================================================= */

.document-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.55);
}

.document-modal{
  position:relative;
  width:100%;
  max-width:430px;
  padding:25px 20px 20px;
  border-radius:20px;
  background:#fff;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.document-modal h3{
  margin:0 35px 10px 0;
  font-size:18px;
}

.document-modal p{
  color:#475467;
  line-height:1.5;
  font-size:14px;
}

.document-modal .document-icon{
  margin-bottom:10px;
  font-size:38px;
}

.document-info{
  padding:11px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#f7f9fc;
  font-size:13px!important;
}

.document-close{
  position:absolute;
  top:14px;
  right:14px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#f2f4f7;
  cursor:pointer;
  font-size:16px;
}

/* =========================================================
   SEARCH
   ========================================================= */

.searchbar{
  position:fixed;
  right:0;
  bottom:0;
  left:0;
  z-index:15;
  max-width:920px;
  margin:auto;
  padding:10px 18px 15px;
  border-top:1px solid var(--border);
  background:rgba(244,247,251,.96);
  backdrop-filter:blur(10px);
}

.form{
  display:flex;
  gap:8px;
  padding:7px 7px 7px 13px;
  border:1px solid var(--border);
  border-radius:15px;
  background:#fff;
  box-shadow:var(--shadow);
}

.form input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
}

.send{
  padding:10px 15px;
  border:0;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
  font-weight:700;
}

.disclaimer{
  margin:8px 3px 0;
  color:var(--muted);
  font-size:11px;
  text-align:center;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){

  .header{
    padding:15px;
  }

  .header-inner{
    align-items:flex-start;
  }

  .challenge-header-button{
    padding:8px;
    font-size:12px;
  }

  .content{
    padding:15px 12px 125px;
  }

  .msg{
    max-width:94%;
  }

  .searchbar{
    padding:9px 12px 13px;
  }

  .document-overlay{
    align-items:flex-end;
    padding:10px;
  }

  .document-modal{
    border-radius:20px 20px 12px 12px;
    padding:22px 17px 17px;
  }

  .challenge-secret-input{
    flex-direction:column;
  }
}
</style>
</head>

</div>

/* =========================================================
   UTILITAIRES
   ========================================================= */

const $ = selector =>
  document.querySelector(selector);


function escapeHtml(value){

  return String(value).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[char])
  );

}


function normalize(value){

  return String(value)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();

}


function isMobileDevice(){

  return /Android|iPhone|iPad|iPod|Mobile/i
    .test(navigator.userAgent);

}


/* =========================================================
   MOTEUR RH
   ========================================================= */

function score(question,item){

  const q = normalize(question);
  let total = 0;

  for(const keyword of item.keywords){

    const key = normalize(keyword);

    if(q.includes(key)){
      total += key.length >= 7 ? 3 : 2;
    }

  }

  return total;
}


function findMatches(question){

  return FAQ
    .map(item => ({
      item,
      score:score(question,item)
    }))
    .filter(result => result.score > 0)
    .sort((a,b) => b.score - a.score);

}

function contactHtml(contactKey){

  const contact = CONTACTS[contactKey];

  if(!contact){
    return "";
  }

  const emailOk =
    contact.email &&
    !contact.email.includes("A_COMPLETER");

  const phoneOk =
    contact.phone &&
    !contact.phone.includes("A_COMPLETER");

  let html = `
    <div class="contact">

      <strong>
        📍 Votre interlocuteur :
        ${escapeHtml(contact.label)}
      </strong>
  `;

  if(emailOk){

    html += `
      <div>
        ✉️
        <a href="mailto:${escapeHtml(contact.email)}">
          ${escapeHtml(contact.email)}
        </a>
      </div>
    `;

  }

  if(phoneOk){

    html += `
      <div>
        ☎️ ${escapeHtml(contact.phone)}
      </div>
    `;

  }

  html += `</div><div class="actions">`;

  if(emailOk){

    html += `
      <a
        class="action primary"
        href="mailto:${escapeHtml(contact.email)}">
        ✉️ Envoyer un email
      </a>
    `;

  }

  if(phoneOk){

    html += `
      <a
        class="action"
        href="tel:${escapeHtml(
          contact.phone.replace(/\s/g,"")
        )}">
        ☎️ Appeler
      </a>
    `;

  }

  html += `</div>`;

  return html;

}

/* =========================================================
   OUVERTURE DOCUMENT
   ========================================================= */

function openDocument(doc){

  if(!doc || !doc.url){
    return;
  }

  if(!isMobileDevice()){

    const opened =
      window.open(
        doc.url,
        "_blank",
        "noopener,noreferrer"
      );

    if(!opened){
      window.location.href =
        doc.url;
    }

    return;

  }

  showMobileDocumentNotice(doc);

}


/* =========================================================
   MODALE MOBILE
   ========================================================= */

function showMobileDocumentNotice(doc){

  const existing =
    document.getElementById("documentModal");

  if(existing){
    existing.remove();
  }

  const display =
    getDocumentPresentation(doc);

  const modal =
    document.createElement("div");

  modal.id = "documentModal";

  modal.innerHTML = `

    <div
      class="document-overlay"
      onclick="closeDocumentModal(event)">

      <div
        class="document-modal"
        onclick="event.stopPropagation()">

        <button
          class="document-close"
          type="button"
          onclick="closeDocumentModal()">
          ✕
        </button>

        <div class="document-icon">
          ${display.icon}
        </div>

        <h3>
          ${escapeHtml(
            doc.title || "Ressource RH"
          )}
        </h3>

        <p>
          Vous consultez cette ressource
          depuis un téléphone.
          L'accès à certains contenus de
          l'intranet peut nécessiter une
          reconnexion.
        </p>

        <p class="document-info">

          Si l'intranet vous demande vos
          identifiants, connectez-vous puis
          revenez dans votre navigateur.

        </p>

        <div class="actions">

          <a
            class="action primary"
            href="${escapeHtml(doc.url)}">

            ${display.button}

          </a>

          <button
            class="action"
            type="button"
            onclick="closeDocumentModal()">

            Retour

          </button>

        </div>

      </div>

    </div>
  `;

  document.body.appendChild(modal);

}


function closeDocumentModal(event){

  if(
    event &&
    event.target !== event.currentTarget
  ){
    return;
  }

  const modal =
    document.getElementById("documentModal");

  if(modal){
    modal.remove();
  }

}

function loadChallenge(){

  try{

    const saved =
      localStorage.getItem(CHALLENGE_KEY);

    if(saved){

      const parsed =
        JSON.parse(saved);

      if(
        parsed &&
        typeof parsed.step === "number"
      ){
        challengeState = {
          step:Math.min(
            parsed.step,
            CHALLENGE_STEPS.length
          ),
          letters:Array.isArray(parsed.letters)
            ? parsed.letters
            : [],
          completed:!!parsed.completed
        };
      }

    }

  }catch(error){

    console.warn(
      "Impossible de charger le challenge.",
      error
    );

  }

}

  try{

      JSON.stringify(challengeState)
    );

            class="challenge-feedback"
            id="challengeFeedback">
          </div>

        </div>

        <div class="challenge-secret">

          <strong>
            🔐 Mot secret
          </strong>

          <div class="secret-letters">

            ${CHALLENGE_SECRET
              .split("")
              .map(
                (letter,index) => `

                  <div
                    class="secret-letter ${
                      index < challengeState.letters.length
                        ? "found"
                        : ""
                    }">

                    ${
                      index < challengeState.letters.length
                        ? letter
                        : "?"
                    }

                  </div>

                `
              )
              .join("")}

          </div>

        </div>

      </div>

    </div>
  `;

}


function challengeSecretHtml(){

  return `

    <div class="challenge-card">

      <div class="challenge-top">

        <h2>
          🔐 Dernière étape
        </h2>

        <p>
          Les cinq premières lettres sont à vous.
          À vous de trouver le mot complet.
        </p>

      </div>

      <div class="challenge-body">

        <div class="challenge-secret">

          <strong>
            Votre mot secret :
          </strong>

          <div class="secret-letters">

            ${CHALLENGE_SECRET
              .split("")
              .map(
                (letter,index) => `

                  <div class="secret-letter found">
                    ${index < 5 ? letter : "?"}
                  </div>

                `
              )
              .join("")}

          </div>

          <div class="challenge-secret-input">

            <input
              id="challengeSecretInput"
              autocomplete="off"
              maxlength="30"
              placeholder="Entrez le mot secret">

            <button
              class="action primary"
              type="button"
              onclick="checkChallengeSecret()">

              🔓 Valider

            </button>

          </div>

          <div
            id="challengeSecretFeedback"
            class="challenge-feedback">
          </div>

        </div>

      </div>

    </div>

  `;

}


function showChallenge(){

  const existing =
    document.getElementById("challengeContainer");

  if(existing){
    existing.remove();
  }

  const container =
    document.createElement("div");

  container.id =
    "challengeContainer";

  container.innerHTML =
    challengeHtml();

  const content =
    document.querySelector(".content");

  const welcome =
    document.querySelector(".welcome");

  content.insertBefore(
    container,
    welcome
  );

  container.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


function answerChallenge(selectedIndex){

  const current =
    CHALLENGE_STEPS[challengeState.step];

  if(!current){
    return;
  }

  const feedback =
    document.getElementById(
      "challengeFeedback"
    );

  const buttons =
    document.querySelectorAll(
      ".challenge-option"
    );

  buttons.forEach(button => {
    button.disabled = true;
  });


  if(selectedIndex === current.answer){

    buttons[selectedIndex]
      ?.classList.add("correct");

    feedback.innerHTML =
      "✅ " +
      escapeHtml(current.explanation);

    challengeState.letters.push(
      current.letter
    );

    challengeState.step++;

    saveChallenge();

    setTimeout(() => {

      showChallenge();

      if(
        challengeState.step >=
        CHALLENGE_STEPS.length
      ){

        setTimeout(() => {

          addMessage(`
            <div class="answer">

              <span class="badge">
                🎯 Challenge
              </span>

              <h3>
                Vous avez trouvé les 5 premiers indices !
              </h3>

              <p>
                Il ne vous reste plus qu'à trouver
                le mot complet.
              </p>

            </div>
          `);

        },200);

      }

    },850);

  }else{

    buttons[selectedIndex]
      ?.classList.add("wrong");

    feedback.innerHTML =
      "❌ Pas tout à fait… Essayez encore.";

    setTimeout(() => {

      buttons.forEach(button => {
        button.disabled = false;
        button.classList.remove("wrong");
      });

      feedback.innerHTML = "";

    },900);

  }

}


function checkChallengeSecret(){

  const input =
    document.getElementById(
      "challengeSecretInput"
    );

  const feedback =
    document.getElementById(
      "challengeSecretFeedback"
    );

  if(!input || !feedback){
    return;
  }

  const value =
    normalize(input.value)
      .replace(/\s+/g,"");

  if(value === normalize(CHALLENGE_SECRET)){

    challengeState.completed =
      true;

    challengeState.letters =
      CHALLENGE_SECRET.split("");

    saveChallenge();

    showChallenge();

    addMessage(`
      <div class="answer">

        <span class="badge">
          🏆 Mission accomplie
        </span>

        <h3>
          Bravo, vous avez trouvé le mot secret !
        </h3>

        <p>
          Vous venez de terminer le
          <strong>Challenge Conflans</strong>.
        </p>

      </div>
    `);

  }else{

    feedback.innerHTML =
      "❌ Ce n'est pas le bon mot. " +
      "Relisez les indices !";

    input.select();

  }

}


function resetChallenge(){

  challengeState = {
    step:0,
    letters:[],
    completed:false
  };

  saveChallenge();
  showChallenge();

}


/* =========================================================
   REPONSE RH
   ========================================================= */

function answer(question){

  const easterEgg =
    checkEasterEgg(question);

  if(easterEgg){

    addMessage(`

      <div class="answer">

        <span class="badge">
          🤫 Easter egg
        </span>

        <h3>
          ${easterEgg.title}
        </h3>

        <p>
          ${easterEgg.text}
        </p>

      </div>

    `);

    return;

  }


  const matches =
    findMatches(question);


  if(!matches.length){

    addMessage(`

      <div class="answer">

        <h3>
          Je n'ai pas identifié votre demande
        </h3>

        <p>
          Essayez avec des mots comme
          <strong>congés</strong>,
          <strong>bulletin de salaire</strong>,
          <strong>carrière</strong>,
          <strong>formation</strong>,
          <strong>intranet</strong>
          ou
          <strong>informatique</strong>.
        </p>

        <p>
          Vous pouvez également utiliser
          les suggestions proposées au-dessus.
        </p>

      </div>

    `);

    return;

  }


  const best =
    matches[0];

  const second =
    matches[1];


  let html = `

    <div class="answer">

      <span class="badge">
        ${escapeHtml(best.item.category)}
      </span>

      <h3>
        ${escapeHtml(best.item.title)}
      </h3>

      <p>
        ${escapeHtml(best.item.answer)}
      </p>

      ${contactHtml(best.item.contact)}

  `;


  if(best.item.documents){

    html += best.item.documents
      .map(
        key =>
          documentButton(
            DOCUMENTS[key]
          )
      )
      .join("");

  }


  if(
    second &&
    second.score >= best.score - 1
  ){

    html += `

      <p
        style="
          margin-top:14px;
          color:#667085;
          font-size:13px;
        ">

        💡 Votre demande pourrait également
        concerner :

        <strong>
          ${escapeHtml(second.item.category)}
        </strong>.

      </p>

    `;

  }


  html += `</div>`;

  addMessage(html);

}


/* =========================================================
   QUESTION
   ========================================================= */

function submitQuestion(question){

  const value =
    String(question || "").trim();

  if(!value){
    return;
  }

  addMessage(
    escapeHtml(value),
    "user"
  );

  setTimeout(
    () => answer(value),
    120
  );

  $("#question").value = "";

}


/* =========================================================
   EVENEMENTS
   ========================================================= */

$("#questionForm")
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();

      submitQuestion(
        $("#question").value
      );

    }
  );


$("#openChallengeButton")
  .addEventListener(
    "click",
    showChallenge
  );


$("#startChallengeButton")
  .addEventListener(
    "click",
    showChallenge
  );


/* =========================================================
   SUGGESTIONS
   ========================================================= */

const suggestionsContainer =
  $("#suggestions");


suggestions.forEach(
  ([label,question]) => {

    const button =
      document.createElement("button");

    button.className =
      "chip";

    button.type =
      "button";

    button.textContent =
      label;

    button.addEventListener(
      "click",
      () => submitQuestion(question)
    );

    suggestionsContainer
      .appendChild(button);

  }
);


/* =========================================================
   INITIALISATION
   ========================================================= */

$("#orgName").textContent =
  ORG_NAME;

loadChallenge();

  addMessage(`

    <div class="answer">

      <span class="badge">
        👋 Bienvenue
      </span>

      <h3>
        Je suis votre Assistant RH.
      </h3>

      <p>
        Posez-moi votre question et je vous
        orienterai vers le bon interlocuteur
        ou la bonne ressource.
      </p>

      <p>
        Et si vous aimez les petits défis…
        le bouton <strong>🎯 Challenge</strong>
        cache peut-être quelque chose. 😉
      </p>

    </div>

  `);

},300);

</script>
