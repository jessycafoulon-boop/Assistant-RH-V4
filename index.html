<title>Assistant RH</title>

<style>
:root{
  --primary:#2457a6;
  --primary-dark:#173d78;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#667085;
  --border:#dfe5ee;
  --success:#16794c;
  --shadow:0 12px 35px rgba(23,32,51,.12);
  --radius:18px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--text);
}

button,
input{
  font:inherit;
}

.app{
  max-width:920px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:24px 24px 22px;
  position:sticky;
  top:0;
  z-index:3;
}

.brand{
  display:flex;
  gap:14px;
  align-items:center;
}

.logo{
  width:46px;
  height:46px;
  border-radius:14px;
  background:rgba(255,255,255,.16);
  display:grid;
  place-items:center;
  font-size:24px;
}

h1{
  font-size:22px;
  margin:0 0 3px;
}

.subtitle{
  font-size:13px;
  opacity:.88;
}

.content{
  padding:22px 18px 30px;
  flex:1;
}

.welcome{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.welcome h2{
  font-size:19px;
  margin:0 0 8px;
}

.welcome p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

.suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:16px;
}

.chip{
  border:1px solid var(--border);
  background:#fff;
  border-radius:999px;
  padding:9px 13px;
  cursor:pointer;
  color:var(--text);
  transition:.15s ease;
}

.chip:hover{
  border-color:var(--primary);
  color:var(--primary);
  transform:translateY(-1px);
}

.chat{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.msg{
  max-width:86%;
  padding:13px 15px;
  border-radius:16px;
  line-height:1.5;
  font-size:14px;
}

.bot{
  align-self:flex-start;
  background:#fff;
  border:1px solid var(--border);
  border-bottom-left-radius:5px;
}

.user{
  align-self:flex-end;
  background:var(--primary);
  color:#fff;
  border-bottom-right-radius:5px;
}

.answer{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  box-shadow:0 5px 18px rgba(23,32,51,.06);
}

.answer h3{
  font-size:16px;
  margin:0 0 7px;
}

.answer p{
  margin:7px 0;
  color:#344054;
  line-height:1.5;
}

.badge{
  display:inline-block;
  background:#eef4ff;
  color:var(--primary-dark);
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  margin-bottom:8px;
}

.contact{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#f7f9fc;
  border:1px solid var(--border);
}

.contact strong{
  display:block;
  margin-bottom:4px;
}

.contact a{
  color:var(--primary);
  font-weight:700;
  text-decoration:none;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.action{
  border:1px solid var(--border);
  background:#fff;
  border-radius:10px;
  padding:8px 11px;
  cursor:pointer;
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  transition:.15s ease;
}

.action:hover{
  border-color:var(--primary);
}

.action.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.action.primary:hover{
  background:var(--primary-dark);
}

/* =========================
   DOCUMENTS
   ========================= */

.document-box{
  margin-top:14px;
  padding:13px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#f8fafc;
}

.document-title{
  font-weight:700;
  margin-bottom:4px;
}

.document-description{
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px;
}

.document-format{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  background:#eef4ff;
  color:var(--primary-dark);
  border-radius:999px;
  padding:4px 8px;
  margin-bottom:8px;
}

/* =========================
   FENÊTRE MOBILE
   ========================= */

.document-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.document-modal{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:20px;
  padding:25px 20px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  position:relative;
}

.document-modal h3{
  margin:0 35px 10px 0;
  font-size:18px;
}

.document-modal p{
  color:#475467;
  line-height:1.5;
  font-size:14px;
}

.document-icon{
  font-size:38px;
  margin-bottom:10px;
}

.document-info{
  background:#f7f9fc;
  border:1px solid var(--border);
  padding:11px;
  border-radius:12px;
  font-size:13px!important;
}

.document-close{
  position:absolute;
  right:14px;
  top:14px;
  border:0;
  background:#f2f4f7;
  width:34px;
  height:34px;
  border-radius:50%;
  cursor:pointer;
  font-size:16px;
}

.document-actions{
  margin-top:18px;
}

/* =========================
   RECHERCHE
   ========================= */

.searchbar{
  position:sticky;
  bottom:0;
  background:rgba(244,247,251,.95);
  backdrop-filter:blur(10px);
  padding:12px 18px 18px;
  border-top:1px solid var(--border);
}

.form{
  display:flex;
  gap:8px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:7px 7px 7px 13px;
  box-shadow:var(--shadow);
}

.form input{
  border:0;
  outline:0;
  flex:1;
  min-width:0;
  color:var(--text);
  background:transparent;
}

.send{
  border:0;
  background:var(--primary);
  color:#fff;
  border-radius:10px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:700;
}

.send:hover{
  background:var(--primary-dark);
}

.disclaimer{
  font-size:11px;
  color:var(--muted);
  margin:8px 3px 0;
  text-align:center;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){

  .header{
    padding:18px;
  }

  .content{
    padding:15px 12px 24px;
  }

  .searchbar{
    padding:10px 12px 15px;
  }

  .msg{
    max-width:94%;
  }

  .document-overlay{
    align-items:flex-end;
    padding:10px;
  }

  .document-modal{
    border-radius:20px 20px 12px 12px;
    padding:22px 17px 17px;
  }
}
</style>

/*
============================================================
SECURITE / UTILITAIRES
============================================================
*/

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,

    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[c])
  );

}


function normalize(s){

  return String(s)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}


/*
============================================================
DETECTION MOBILE
============================================================
*/

function isMobileDevice(){

  return /Android|iPhone|iPad|iPod|Mobile/i.test(
    navigator.userAgent
  );

}


/*
============================================================
MOTEUR DE RECHERCHE
============================================================
*/

function score(question,item){

  const q =
    normalize(question);

  let total = 0;

  for(const k of item.keywords){

    const nk =
      normalize(k);

    if(q.includes(nk)){

      total +=
        nk.length >= 7
          ? 3
          : 2;

    }

  }

  return total;

}


function findMatches(question){

  return FAQ

    .map(x => ({
      item:x,
      score:score(question,x)
    }))

    .filter(x =>
      x.score > 0
    )

    .sort((a,b) =>
      b.score - a.score
    );

}


/*
============================================================
CONTACT
============================================================
*/

function contactHtml(contactKey){

  const c =
    CONTACTS[contactKey];

  if(!c){
    return "";
  }

  const emailOk =
    c.email &&
    !c.email.includes("A_COMPLETER");

  const phoneOk =
    c.phone &&
    !c.phone.includes("A_COMPLETER");

  let out = `

    <div class="contact">

      <strong>
        📍 Votre interlocuteur :
        ${escapeHtml(c.label)}
      </strong>

  `;


  if(emailOk){

    out += `

      <div>
        ✉️
        <a
          href="mailto:${escapeHtml(c.email)}">
          ${escapeHtml(c.email)}
        </a>
      </div>

    `;

  }else{

    out += `

      <div>
        ✉️ Email :
        <em>à compléter</em>
      </div>

    `;

  }


  if(phoneOk){

    out += `

      <div>
        ☎️ ${escapeHtml(c.phone)}
      </div>

    `;

  }else{

    out += `

      <div>
        ☎️ Téléphone :
        <em>à compléter</em>
      </div>

    `;

  }


  out += `

    </div>

    <div class="actions">

  `;


  if(emailOk){

    out += `

      <a
        class="action primary"
        href="mailto:${escapeHtml(c.email)}">

        ✉️ Envoyer un email

      </a>

    `;

  }


  if(phoneOk){

    out += `

      <a
        class="action"
        href="tel:${escapeHtml(
          c.phone.replace(/\s/g,'')
        )}">

        ☎️ Appeler

      </a>

    `;

  }


  out += `
    </div>
  `;

  return out;

}

/*

DOCUMENT
============================================================
*/

function documentButton(doc){

  if(!doc || !doc.url){
    return "";
  }

  const action =
    getDocumentAction(doc);

  return `

    <div class="document-box">

      <div class="document-title">
        ${action.icon}
        ${escapeHtml(doc.title)}
      </div>

      <div class="document-description">
        ${escapeHtml(
          doc.description || ""
        )}
      </div>

      <span class="document-format">
        ${escapeHtml(
          doc.format || "Lien"
        )}
      </span>

      <div class="actions">

        <button
          class="action primary"
          type="button"
          onclick='openDocument(${JSON.stringify(doc)})'>

          ${action.icon}
          ${escapeHtml(action.label)}

        </button>

      </div>

    </div>

  `;

}


/*
============================================================
OUVERTURE DU DOCUMENT
============================================================
*/

function openDocument(doc){

  if(!doc || !doc.url){
    return;
  }


  /*
    SUR PC :
    ouverture directe dans un nouvel onglet.
  */

  if(!isMobileDevice()){

    const opened =
      window.open(
        doc.url,
        "_blank",
        "noopener,noreferrer"
      );


    if(!opened){

      window.location.href =
        doc.url;

    }

    return;
  }


  /*
    SUR MOBILE :
    affichage d'une information avant ouverture.
  */

  showMobileDocumentNotice(doc);

}


/*
============================================================
FENÊTRE MOBILE
============================================================
*/

function showMobileDocumentNotice(doc){

  const existing =
    document.getElementById(
      "documentModal"
    );


  if(existing){
    existing.remove();
  }


  const action =
    getDocumentAction(doc);


  const modal =
    document.createElement("div");


  modal.id =
    "documentModal";


  modal.innerHTML = `

    <div
      class="document-overlay"
      onclick="closeDocumentModal(event)">

      <div
        class="document-modal"
        onclick="event.stopPropagation()">

        <button
          class="document-close"
          type="button"
          onclick="closeDocumentModal()">

          ✕

        </button>


        <div class="document-icon">
          ${action.icon}
        </div>


        <h3>
          ${escapeHtml(
            doc.title ||
            "Ressource RH"
          )}
        </h3>


        <p>

          Vous consultez cette ressource
          depuis un téléphone.

          L'accès à certains contenus de
          l'intranet peut nécessiter une
          reconnexion.

        </p>


        <p class="document-info">

          Si l'intranet vous demande vos
          identifiants, connectez-vous puis
          revenez dans votre navigateur.

        </p>


        <div
          class="actions document-actions">

          <a
            class="action primary"
            href="${escapeHtml(doc.url)}">

            ${action.icon}
            ${escapeHtml(action.label)}

          </a>


          <button
            class="action"
            type="button"
            onclick="closeDocumentModal()">

            Retour

          </button>

        </div>

      </div>

    </div>

  `;


  document.body.appendChild(modal);

}


/*
============================================================
FERMETURE FENÊTRE DOCUMENT
============================================================
*/

function closeDocumentModal(event){

  if(
    event &&
    event.target !== event.currentTarget
  ){
    return;
  }


  const modal =
    document.getElementById(
      "documentModal"
    );


  if(modal){
    modal.remove();
  }

}

/*
============================================================
REPONSE
============================================================
*/

function answer(question){

  const matches =
    findMatches(question);


  if(!matches.length){

    addMessage(`

      <div class="answer">

        <h3>
          Je n'ai pas identifié votre demande
        </h3>

        <p>

          Essayez avec des mots comme

          <strong>congés</strong>,

          <strong>bulletin de salaire</strong>,

          <strong>carrière</strong>,

          <strong>formation</strong>,

          <strong>intranet</strong>

          ou

          <strong>informatique</strong>.

        </p>

        <p>

          Si vous le souhaitez, vous pouvez
          également contacter directement
          votre service RH.

        </p>

      </div>

    `);

    return;
  }


  const best =
    matches[0];


  const second =
    matches[1];


  let html = `

    <div class="answer">

      <span class="badge">

        ${escapeHtml(
          best.item.category
        )}

      </span>


      <h3>

        ${escapeHtml(
          best.item.title
        )}

      </h3>


      <p>

        ${escapeHtml(
          best.item.answer
        )}

      </p>


      ${contactHtml(
        best.item.contact
      )}

  `;


  /*
    DOCUMENTS
  */

  if(best.item.documents){

    html += best.item.documents

      .map(
        docKey =>
          documentButton(
            DOCUMENTS[docKey]
          )
      )

      .join("");

  }


  /*
    SUGGESTION D'UNE AUTRE CATEGORIE
  */

  if(
    second &&
    second.score >= best.score - 1
  ){

    html += `

      <p
        style="
          margin-top:14px;
          color:#667085;
          font-size:13px;
        ">

        Si votre question est plutôt liée à

        <strong>
          ${escapeHtml(
            second.item.category
          )}
        </strong>,

        dites-le-moi ou reformulez votre
        demande.

      </p>

    `;

  }


  html += `
    </div>
  `;


  addMessage(html);

}


/*
============================================================
ENVOI QUESTION
============================================================
*/

function submitQuestion(q){

  q =
    q.trim();


  if(!q){
    return;
  }


  addMessage(
    escapeHtml(q),
    "user"
  );


  setTimeout(
    () => answer(q),
    120
  );


  document.getElementById(
    "question"
  ).value = "";

}
